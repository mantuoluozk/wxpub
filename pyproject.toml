[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wxpub"
version = "0.1.0"
description = "Markdown to WeChat Official Account draft, with covers that actually look good. 一条命令把 Markdown 发进公众号草稿箱。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mantuoluozk" }]
keywords = ["wechat", "weixin", "markdown", "公众号", "cover", "publisher", "wechat-official-account"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Chinese (Simplified)",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "Pillow>=9.0",
    "requests>=2.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
wxpub = "wxpub.cli:main"

[project.urls]
Homepage = "https://github.com/mantuoluozk/wxpub"
Issues = "https://github.com/mantuoluozk/wxpub/issues"

[tool.setuptools.packages.find]
include = ["wxpub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
